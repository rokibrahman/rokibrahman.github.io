<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOUR_NAME</title>
<meta name="description" content="Personal site of YOUR_NAME: projects and experiments.">
<style>
  :root { --bg:#fafaf8; --text:#1d1f24; --muted:#666b75; --line:#e4e2dc; --accent:#2f5d8a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171b; --text:#ecebe7; --muted:#9a9ea8; --line:#2a2d33; --accent:#8fb4dc; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:64px 20px 40px; }
  h1 { font-size:34px; line-height:1.2; margin:0 0 8px; letter-spacing:-0.01em; }
  .lead { color:var(--muted); font-size:18px; margin:0 0 40px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; }
  .card { display:block; padding:18px 20px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:inherit; }
  .card:hover { border-color:var(--accent); }
  .card strong { display:block; font-size:17px; }
  .card span { color:var(--muted); font-size:15px; }
  footer { margin-top:56px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>YOUR_NAME</h1>
  <p class="lead">Projects and experiments.</p>

  <h2>Projects</h2>
  <a class="card" href="mr-raven/">
    <strong>Mr. Raven</strong>
    <span>A private, self-hosted AI executive assistant.</span>
  </a>

  <footer>© 2026 YOUR_NAME</footer>
</main>
</body>
</html>
